name: ShortDrama

options:
  bundleIdPrefix: com.djs66256
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  ShortDrama:
    type: application
    platform: iOS
    sources:
      - path: ShortDrama/Sources
        includes: "**/*.swift"
    resources:
      - path: ShortDrama/Resources
    info:
      path: ShortDrama/Resources/Info.plist
      properties:
        API_BASE_URL: "$(API_BASE_URL)"
        MALL_BASE_URL: "$(MALL_BASE_URL)"
        EARN_BASE_URL: "$(EARN_BASE_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        INFOPLIST_PREPROCESS: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.djs66256.short_drama
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig

  ShortDramaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShortDrama/Tests
        includes: "**/*.swift"
    dependencies:
      - target: ShortDrama
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ShortDrama:
    build:
      targets:
        ShortDrama: all
        ShortDramaTests: [test]
    test:
      targets:
        - name: ShortDramaTests
    run:
      config: Debug
    archive:
      config: Release
