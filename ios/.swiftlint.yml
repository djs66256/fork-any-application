# SwiftLint configuration for ShortDrama iOS project
#
# See https://github.com/realm/SwiftLint for rule documentation

# Global settings
line_length:
  warning: 120
  error: 200

# Excluded paths
excluded:
  - .build
  - ShortDrama.xcodeproj

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - todo

# Opt-in rules
opt_in_rules:
  - empty_count
  - unused_import
  - force_unwrapping
  - closure_spacing
  - collection_alignment
  - explicit_init
  - first_where
  - operator_usage_whitespace
  - sorted_imports
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule-specific overrides
type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
