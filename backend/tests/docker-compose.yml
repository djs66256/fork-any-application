# ============================================================
# 本地开发环境依赖
#
# 启动:  docker compose up -d
# 停止:  docker compose down
# 清空:  docker compose down -v
# ============================================================

services:
  # ── Redis（缓存 + MQ）─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fork-any-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dev-network

  # ── PostgreSQL（Supabase 兼容）────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: fork-any-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      dev-network:
        aliases:
          - db

  # ── Supabase Studio（Web 管理面板）────────────────────────
  studio:
    image: supabase/studio:latest
    container_name: fork-any-studio
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-8000}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_ORG:-fork-any}
      DEFAULT_PROJECT_NAME: ${STUDIO_PROJECT:-dev}
      SUPABASE_URL: http://localhost:54321
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      SNIPPETS_MANAGEMENT_FOLDER: /app/studio/snippets
    volumes:
      - ./functions:/app/studio/functions:ro
    depends_on:
      meta:
        condition: service_started
    networks:
      - dev-network

  # ── Postgres Meta（Supabase Studio 后端）─────────────────
  meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: fork-any-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  # ── Mailpit（本地邮件捕获）─────────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: fork-any-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - dev-network

volumes:
  redis_data:
  postgres_data:

networks:
  dev-network:
    driver: bridge
    name: fork-any-dev-network
