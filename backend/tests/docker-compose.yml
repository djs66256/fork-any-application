# ============================================================
# 本地开发环境依赖 — 完整 Supabase + Redis 栈
#
# 服务端口：
#   5432  — PostgreSQL（Supabase 兼容数据库）
#   6379  — Redis（缓存 + MQ）
#   54321 — Kong API Gateway（Supabase 统一入口）
#   8000  — Supabase Studio（Web 管理面板）
#   8025  — Mailpit（邮件捕获 Web UI）
#   1025  — Mailpit SMTP
#
# 启动:  docker compose up -d
# 停止:  docker compose down
# 清空:  docker compose down -v
#
# 首次启动后等待 ~15 秒让 GoTrue 自动迁移 auth schema
# ============================================================

services:
  # ── PostgreSQL（Supabase 兼容）────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: fork-any-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - dev-network

  # ── Redis（缓存 + MQ）─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fork-any-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dev-network

  # ── GoTrue（Supabase Auth）────────────────────────────────
  auth:
    image: supabase/gotrue:v2.170.0
    container_name: fork-any-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "http://localhost:54321"
      GOTRUE_SITE_URL: "http://localhost:3000"
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3000,http://localhost:3001"
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:postgres@postgres:5432/postgres?sslmode=disable"
      GOTRUE_JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long!}"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: "authenticated"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMTP_HOST: "mailpit"
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: "admin@example.com"
      GOTRUE_SMTP_SENDER_NAME: "ShortDrama Admin"
      GOTRUE_MAILER_URLPATHS_INVITE: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/auth/v1/verify"
      GOTRUE_LOG_LEVEL: "debug"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dev-network

  # ── PostgREST（REST API over PostgreSQL）──────────────────
  rest:
    image: postgrest/postgrest:v14.1
    container_name: fork-any-rest
    restart: unless-stopped
    ports:
      - "54323:3000"
    environment:
      PGRST_DB_URI: "postgres://authenticator:postgres@postgres:5432/postgres"
      PGRST_DB_SCHEMAS: "public,storage"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_DB_EXTRA_SEARCH_PATH: "public,extensions"
      PGRST_JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long!}"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long!}"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dev-network

  # ── Realtime（WebSocket 实时订阅）──────────────────────────
  realtime:
    image: supabase/realtime:v2.34.44
    container_name: fork-any-realtime
    restart: unless-stopped
    environment:
      PORT: "4000"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "supabase_realtime_admin"
      DB_PASSWORD: "postgres"
      DB_NAME: "postgres"
      DB_SSL: "false"
      SECURE_CHANNELS: "false"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long!}"
      REPLICATION_MODE: "RLS"
      REPLICATION_POLL_INTERVAL: "100"
      SLOT_NAME: "supabase_realtime_replication_slot"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - dev-network

  # ── Storage API（文件存储）─────────────────────────────────
  storage:
    image: supabase/storage-api:v1.33.0
    container_name: fork-any-storage
    restart: unless-stopped
    environment:
      ANON_KEY: "${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}"
      SERVICE_KEY: "${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}"
      POSTGREST_URL: "http://rest:3000"
      PGRST_JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long!}"
      DATABASE_URL: "postgres://supabase_storage_admin:postgres@postgres:5432/postgres"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: "file"
      FILE_STORAGE_BACKEND_PATH: "/var/lib/storage"
      TENANT_ID: "stub"
      REGION: "local"
      GLOBAL_S3_BUCKET: "stub"
    volumes:
      - storage_data:/var/lib/storage
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dev-network

  # ── Kong（API Gateway — 端口 54321）──────────────────────
  kong:
    image: kong:3.9
    container_name: fork-any-kong
    restart: unless-stopped
    ports:
      - "54321:8000"
      - "8001:8001"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_LOG_LEVEL: "warn"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PLUGINS: "bundled"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - auth
      - rest
      - storage
      - realtime
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - dev-network

  # ── Supabase Studio（Web 管理面板）────────────────────────
  studio:
    image: supabase/studio:latest
    container_name: fork-any-studio
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-8000}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_ORG:-fork-any}
      DEFAULT_PROJECT_NAME: ${STUDIO_PROJECT:-dev}
      SUPABASE_URL: http://localhost:54321
      SUPABASE_PUBLIC_URL: "http://localhost:54321"
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      SNIPPETS_MANAGEMENT_FOLDER: /app/studio/snippets
    volumes:
      - ./functions:/app/studio/functions:ro
    depends_on:
      meta:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dev-network

  # ── Postgres Meta（Supabase Studio 后端）─────────────────
  meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: fork-any-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dev-network

  # ── Mailpit（本地邮件捕获）─────────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: fork-any-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - dev-network

volumes:
  redis_data:
  postgres_data:
  storage_data:

networks:
  dev-network:
    driver: bridge
    name: fork-any-dev-network
