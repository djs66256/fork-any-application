build:
  maxIssues: 0

config:
  warningsAsErrors: true

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 5

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
      - 'Test'
    functionPattern: '[a-z][a-zA-Z0-9]*|`.*`'

exceptions:
  TooGenericExceptionCaught:
    active: false

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

complexity:
  LongParameterList:
    active: true
    functionThreshold: 10
